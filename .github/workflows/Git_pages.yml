name: Git Pages

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check put repo # To let runners(VM) know which repo to look.
        uses: actions/checkout@v6 # Git action called checkout ver-6
      - name: Setting Python # To let runners(VM) know which repo to look.
        uses: actions/setup-python@v6 # Git action called 
        with:
          python-version: "3.11"
      - name: Install markdown slides # To let runners(VM) know which repo to look.
        run:   pip install git+https://gitlab.com/da_doomer/markdown-slides.git # Git action called 
      - name: Generate slides
        run: mdslides slides.md --output_dir slides
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
            path: ./slides 
  deploy:
    permissions:
       pages: write
       id-token: write
    environment:
       name: github-pages
       url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

