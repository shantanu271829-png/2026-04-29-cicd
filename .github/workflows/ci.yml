name: My CI

on:
  push: #activates (on) when changes pushed to repo.
    branches: [main]
  pull_request:
  workflow_dispatch:


jobs:
  hello:
    name: My Hello Jobs
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello
        run: echo "Hello World fork"

  test:
    name: Test Python package
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10","3.14"] #yaml treats 3.10 as 3.1 that can cause errors
    steps:
      - name: Check put repo # To let runners(VM) know which repo to look.
        uses: actions/checkout@v6 # Git action called checkout ver-6
      - name: Install Python
        uses: actions/setup-python@v6 # Actions have a dedicated Git repo
        with:
          python-version: ${{matrix.python-version}}
      - name: Install package
      #from python.toml
        run: pip install .[test] # period for the current dir and installs both dependencies and optional dependencies
      - name: Run pytest
        run: pytest -vv         # -vv very verbose